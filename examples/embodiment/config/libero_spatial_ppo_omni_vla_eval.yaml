defaults:
  - env/libero_spatial@env.train
  - env/libero_spatial@env.eval
  - model/omni_vla@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "test_libero_spatial_ppo_omni_vla_${now:%Y%m%d-%H%M%S}"
    logger_backends: ["wandb"]

  max_epochs: 1000
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: 25

  resume_dir: /root/data/kaelynwang/Omni_VLA/logs/20260330-16:08:00-libero_spatial_ppo_omni_vla_quickstart/libero_spatial_ppo_omni_vla_20260330-160812/checkpoints/global_step_400  # Set to checkpoint directory path for resuming
  ckpt_path: /root/data/kaelynwang/Omni_VLA/logs/20260330-16:08:00-libero_spatial_ppo_omni_vla_quickstart/libero_spatial_ppo_omni_vla_20260330-160812/checkpoints/global_step_400/actor/model_state_dict/full_weights.pt   # Set to .pt checkpoint path for evaluation

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 2
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  adv_type: gae
  loss_type: decoupled_actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 1.0
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 10

  eval:
    total_num_envs: 10
    auto_reset: True
    ignore_terminations: True
    group_size: 1
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 2400
    use_fixed_reset_state_ids: True
    use_ordered_reset_state_ids: True
    reset_gripper_open: False
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: True
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/root/data/kaelynwang/Omni_VLA/omni_vla_checkpoint_10000"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 128
  seed: 42
  enable_offload: False

  model:
    model_path: "/root/data/kaelynwang/Omni_VLA/omni_vla_checkpoint_10000"
    num_action_chunks: 5
    add_value_head: True
    omni_vla:
      config_name: omni_vla_libero
      detach_critic_input: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
